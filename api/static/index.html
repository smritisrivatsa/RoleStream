<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoleStream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #edf1f5;
    --ink: #142033;
    --muted: #55657a;
    --line: #c7d1de;
    --accent: #2f4be0;
    --accent-soft: #dce3ff;
    --danger: #a3262a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 1rem/1.6 "Public Sans", system-ui, sans-serif;
  }
  main { max-width: 68rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1 {
    margin: 0;
    font: 700 clamp(2.4rem, 7vw, 4rem)/1 "Bricolage Grotesque", "Public Sans", sans-serif;
    letter-spacing: -0.03em;
  }
  .lede { margin: 0.75rem 0 2rem; max-width: 36rem; color: var(--muted); }

  form { display: flex; gap: 0.5rem; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 0.9rem 1rem;
    font: inherit; font-size: 1.1rem; color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink); border-radius: 6px;
  }
  button.ask {
    padding: 0 1.6rem;
    font: 600 1rem "Public Sans", sans-serif;
    color: #fff; background: var(--ink);
    border: 2px solid var(--ink); border-radius: 6px; cursor: pointer;
  }
  button.ask:disabled { opacity: 0.55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .examples { margin: 0.9rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; }
  .examples button {
    padding: 0; font: inherit; font-size: 0.95rem; color: var(--accent);
    background: none; border: 0; border-bottom: 1px solid currentColor; cursor: pointer;
  }

  #status { min-height: 1.6rem; margin: 2rem 0 0.5rem; color: var(--muted); font-size: 0.95rem; }
  #status.error { color: var(--danger); }

  #result { display: none; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 3rem; margin-top: 0.5rem; }
  #result.show { display: grid; }
  @media (max-width: 52rem) { #result.show { grid-template-columns: 1fr; gap: 2rem; } form { flex-direction: column; } button.ask { padding: 0.8rem; } }

  #answer { max-width: 40rem; font-size: 1.1rem; line-height: 1.7; white-space: pre-wrap; }
  .cite {
    display: inline-block; min-width: 1.5em; margin: 0 0.1em; padding: 0 0.3em;
    font: 600 0.8em/1.5 "Public Sans", sans-serif; text-align: center; vertical-align: 0.1em;
    color: var(--accent); background: var(--accent-soft);
    border: 0; border-radius: 4px; cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .cite.on { color: #fff; background: var(--accent); }

  #sources h2 { margin: 0 0 0.25rem; font: 700 1.1rem "Bricolage Grotesque", sans-serif; }
  #sources ol { margin: 0; padding: 0; list-style: none; }
  .src { display: grid; grid-template-columns: 2rem 1fr; gap: 0.5rem; padding: 0.9rem 0.6rem; border-top: 1px solid var(--line); transition: background 120ms; }
  .src.on { background: var(--accent-soft); }
  .src .num { font-weight: 600; color: var(--accent); }
  .src .co { font-weight: 600; }
  .src a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
  .src a:hover { text-decoration-color: var(--accent); }
  .src .meta { color: var(--muted); font-size: 0.85rem; }
  .src details { margin-top: 0.3rem; font-size: 0.9rem; color: var(--muted); }
  .src summary { cursor: pointer; color: var(--accent); }
  .src details p { margin: 0.4rem 0 0; white-space: pre-wrap; max-height: 12rem; overflow: auto; }

  footer { margin-top: 3.5rem; max-width: 38rem; color: var(--muted); font-size: 0.85rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>RoleStream</h1>
  <p class="lede">Ask a question about open tech roles. Each answer cites the job postings it was written from.</p>

  <form id="form">
    <input id="q" type="text" autocomplete="off" aria-label="Your question" placeholder="Which roles mention Kubernetes?" required>
    <button class="ask" id="go" type="submit">Ask</button>
  </form>
  <ul class="examples" id="examples">
    <li><button type="button">Which roles mention Kubernetes?</button></li>
    <li><button type="button">Compare backend roles at Stripe and ClickHouse</button></li>
    <li><button type="button">Data engineer roles</button></li>
  </ul>

  <div id="status" role="status" aria-live="polite"></div>

  <section id="result">
    <div id="answer"></div>
    <aside id="sources" aria-label="Sources">
      <h2>Sources</h2>
      <ol id="src-list"></ol>
    </aside>
  </section>

  <footer>A small local model (llama3.2, 3B) writes the answer from the postings listed under Sources. It can still get details wrong, so check the posting before you rely on it.</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), input = $("q"), go = $("go"), status = $("status");
const result = $("result"), answer = $("answer"), list = $("src-list");

function setActive(ref, on) {
  document.querySelectorAll(`[data-ref="${ref}"]`).forEach((el) => el.classList.toggle("on", on));
}

function renderAnswer(text) {
  answer.textContent = "";
  text.split(/(\[\d+\])/).forEach((part) => {
    const m = part.match(/^\[(\d+)\]$/);
    if (!m) { answer.append(part); return; }
    const b = document.createElement("button");
    b.type = "button"; b.className = "cite"; b.dataset.ref = m[1]; b.textContent = m[1];
    b.setAttribute("aria-label", `Source ${m[1]}`);
    b.addEventListener("mouseenter", () => setActive(m[1], true));
    b.addEventListener("mouseleave", () => setActive(m[1], false));
    b.addEventListener("focus", () => setActive(m[1], true));
    b.addEventListener("blur", () => setActive(m[1], false));
    b.addEventListener("click", () => {
      const row = list.querySelector(`[data-ref="${m[1]}"]`);
      if (!row) return;
      row.scrollIntoView({ block: "nearest", behavior: "smooth" });
      row.querySelector("details").open = true;
    });
    answer.append(b);
  });
}

function renderSources(sources) {
  list.textContent = "";
  sources.forEach((s) => {
    const li = document.createElement("li");
    li.className = "src"; li.dataset.ref = s.ref;
    li.addEventListener("mouseenter", () => setActive(s.ref, true));
    li.addEventListener("mouseleave", () => setActive(s.ref, false));

    const num = document.createElement("div");
    num.className = "num"; num.textContent = s.ref;

    const body = document.createElement("div");
    const co = document.createElement("div");
    co.className = "co"; co.textContent = s.company || "Unknown company";
    const title = document.createElement(s.url ? "a" : "span");
    title.textContent = s.title || "Untitled role";
    if (s.url) { title.href = s.url; title.target = "_blank"; title.rel = "noopener"; }
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [s.section, `match ${s.score}`].filter(Boolean).join(", ");
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "Show passage";
    const p = document.createElement("p");
    p.textContent = s.text || "";
    det.append(sum, p);

    body.append(co, title, meta, det);
    li.append(num, body);
    list.append(li);
  });
}

async function ask(question) {
  go.disabled = true;
  result.classList.remove("show");
  status.className = "";
  const t0 = performance.now();
  const tick = setInterval(() => {
    status.textContent = `Reading postings and writing an answer… ${Math.round((performance.now() - t0) / 1000)} s`;
  }, 500);
  status.textContent = "Reading postings and writing an answer… 0 s";
  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).detail || ""; } catch (_) {}
      throw new Error(res.status === 502
        ? "The API couldn't reach one of its services. Check that the embedding service, Qdrant and Ollama are running."
        : `The API returned an error (${res.status}). ${detail}`);
    }
    const data = await res.json();
    renderAnswer(data.answer);
    renderSources(data.sources);
    result.classList.add("show");
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    const n = data.sources.length;
    status.textContent = n
      ? `Answered in ${secs} s from ${n} posting${n === 1 ? "" : "s"}.`
      : `No postings matched. Try different words.`;
  } catch (err) {
    status.className = "error";
    status.textContent = err instanceof TypeError
      ? "Can't reach the API at this address. Check that uvicorn is running on port 8000."
      : err.message;
  } finally {
    clearInterval(tick);
    go.disabled = false;
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); const q = input.value.trim(); if (q) ask(q); });
$("examples").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  input.value = e.target.textContent; ask(input.value);
});
</script>
</body>
</html>
